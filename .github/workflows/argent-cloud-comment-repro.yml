# Runs the "Post the comment on the issue" step of argent-cloud-issue-repro.yml's comment job
# with the repository's own two actions, unchanged, and the job's own token.
name: Argent Cloud comment step repro

on:
  push:
    branches: [repro/argent-cloud-comment-token]

jobs:
  comment:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/install-argent-cloud
            /.github/actions/post-argent-cloud-comment
          sparse-checkout-cone-mode: false

      - name: Write the comment
        run: echo "Reproduction verdict" > "$RUNNER_TEMP/comment.md"

      - name: Install the argent-cloud CLI
        uses: ./.github/actions/install-argent-cloud

      - name: Post the comment on the issue
        uses: ./.github/actions/post-argent-cloud-comment
        with:
          target: ${{ github.repository }}#1
          comment-file: ${{ runner.temp }}/comment.md
          github-token: ${{ github.token }}
          sim-router-api-key: unused-the-cli-stops-before-it
          backend-ip: 127.0.0.1
